name: NewDisciples
description: "New Disciples"
publish_to: 'none'
#version: 1.0.5+6
version: 1.0.5+8

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Android-only at runtime. Web compilation is isolated using
  # conditional app_update_service exports.
  in_app_update: ^4.2.3

  # image_picker supports the existing mobile profile-picture flow
  # and can use its web implementation when running in a browser.
  image_picker: ^1.1.2

  http: ^1.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#071126"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon.png
